name: Facet update

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: facet-update-${{ github.repository }}-facet-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: agent-facets/facet-update-action@a60b6eb02a5d154c3491c9010ad881fed26a7dda
        with:
          adapter: codex@0.9.0
          cli-version: '0.33.1'
