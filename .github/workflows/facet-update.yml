name: Facet update

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: facet-update-${{ github.repository }}-facet-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: agent-facets/facet-update-action@f67ed0406f8671cacbe0b17c31f74f430c6c98e9
        with:
          cli-version: '0.33.1'
